name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.25.x
  GORELEASER_VERSION: v2.17.0

jobs:
  verify:
    name: Build and verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      candidate_digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $semver_pattern ]]; then
            echo "release tag is not valid SemVer: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ -n "${BASH_REMATCH[5]}" ]]; then
            IFS='.' read -r -a identifiers <<< "${BASH_REMATCH[5]}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "release tag has a zero-padded numeric prerelease identifier: $GITHUB_REF_NAME" >&2
                exit 1
              fi
            done
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release commit is not on origin/main" >&2
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify source
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
      - name: Build release without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish
      - name: Verify every archive and checksum
        run: scripts/verify-release.sh dist "${GITHUB_REF_NAME#v}"
      - name: Test documented install path in a clean environment
        shell: bash
        run: |
          clean_dir="$(mktemp -d)"
          env \
            GOBIN="$clean_dir/bin" \
            GOPATH="$clean_dir/gopath" \
            GOMODCACHE="$clean_dir/modcache" \
            GOPROXY=direct \
            GOWORK=off \
            go install "github.com/1337lean/certpulse/cmd/certpulse@${GITHUB_REF_NAME}"
          test "$("$clean_dir/bin/certpulse" version)" = "${GITHUB_REF_NAME#v}"
      - name: Bundle the verified release candidate
        id: bundle
        shell: bash
        run: |
          candidate_dir="$(mktemp -d)"
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt "$candidate_dir/"
          tar -C "$candidate_dir" -cf release-candidate.tar .
          digest="$(sha256sum release-candidate.tar | awk '{print $1}')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Preserve the verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release-candidate.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    name: Attest verified release artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Mint the Sigstore signing identity.
      attestations: write # Persist provenance in GitHub.
      artifact-metadata: write # Record attested artifact metadata.
    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: handoff
      - name: Verify the artifact handoff
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.verify.outputs.candidate_digest }}
        run: |
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          actual_digest="$(sha256sum handoff/release-candidate.tar | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          mkdir dist
          tar -xf handoff/release-candidate.tar -C dist
      - name: Attest verified release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish:
    name: Publish attested release artifacts
    needs: [verify, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the GitHub release and upload its assets.
    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: handoff
      - name: Verify the artifact handoff
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.verify.outputs.candidate_digest }}
        run: |
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          actual_digest="$(sha256sum handoff/release-candidate.tar | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          mkdir dist
          tar -xf handoff/release-candidate.tar -C dist
      - name: Publish the attested release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ref_object="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
            --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r object_type object_sha <<< "$ref_object"
          for _ in {1..8}; do
            if [[ "$object_type" = commit ]]; then
              break
            fi
            if [[ "$object_type" != tag || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "release tag does not resolve to a commit" >&2
              exit 1
            fi
            ref_object="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
              --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r object_type object_sha <<< "$ref_object"
          done
          if [[ "$object_type" != commit || "$object_sha" != "$EXPECTED_SHA" ]]; then
            echo "release tag no longer resolves to the workflow commit" >&2
            exit 1
          fi
          compare_status="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...main" \
            --jq '.status')"
          if [[ "$compare_status" != ahead && "$compare_status" != identical ]]; then
            echo "release commit is no longer on main" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "Certpulse $GITHUB_REF_NAME"
